<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Frutiger Aero — Relax</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ИГРА 1: ПУЗЫРИ -->
    <div id="bubblesGame" class="game active">
        <div class="pool-background">
            <canvas id="waterCanvas"></canvas>
            <div class="pool-fallback">
                <div class="pool-tiles">
                    <div class="tile-grid"></div>
                    <div class="tile-grid-distorted"></div>
                </div>
                <div class="pool-water"></div>
                <div class="pool-caustics"></div>
            </div>
        </div>
        <canvas id="bubbleCanvas"></canvas>
        <button id="popAllBtn" class="win-btn pop-all-btn"> Лопнуть все пузыри </button>
        <div class="score-counter bubbles-score">Лопнуто: <span id="scoreBubbles">0</span></div>
    </div>

    <!-- ИГРА 2: ОКНА -->
    <div id="windowsGame" class="game">
        <div class="xp-background">
            <div class="xp-sky"></div>
            <div class="xp-clouds-2"></div>
            <div class="xp-hill-back"></div>
            <div class="xp-hill"></div>
            <div class="xp-cloud-shadows"></div>
            <div class="xp-sun">
                <div class="xp-sun-rainbow"></div>
                <div class="xp-sun-rays xp-sun-rays-1"></div>
                <div class="xp-sun-rays xp-sun-rays-2"></div>
                <div class="xp-sun-rays xp-sun-rays-3"></div>
                <div class="xp-sun-halo"></div>
                <div class="xp-sun-core"></div>
                <div class="xp-moon"></div>
            </div>
            <div class="xp-clouds"></div>
            <div class="xp-clouds-rain"></div>
            <canvas id="windowsBubblesCanvas" class="windows-bubbles"></canvas>
            <div class="xp-rain"></div>
        </div>
        <div class="score-counter windows-score">Закрыто: <span id="scoreWindows">0</span></div>
    </div>

    <!-- ИГРА 3: БРАУЗЕР -->
    <div id="browserGame" class="game">
        <div class="browser-container">
            <div class="browser-toolbar">
                <div class="browser-nav-buttons">
                    <button class="browser-nav-btn" id="btnBack" title="Назад">◀</button>
                    <button class="browser-nav-btn" id="btnForward" title="Вперёд">▶</button>
                    <button class="browser-nav-btn" id="btnRefresh" title="Обновить">⟳</button>
                </div>
                <div class="browser-address">
                    <span class="browser-address-lock">🔒</span>
                    <span class="browser-address-text">http://memes.ru/</span>
                </div>
                <div class="browser-counter hearts-counter" id="heartsCounter" style="display: none;">
                    ❤ <span id="heartsScore">0</span>
                </div>
                <div class="browser-counter"> MEME: <span id="memeScore">0</span></div>
                <button class="paint-tab-btn" id="paintTabBtn" style="display:none;" title="Paint">🎨</button>
            </div>
            <div class="browser-page" id="browserPage"></div>
        </div>
    </div>

    <!-- ОКНО PAINT -->
    <div id="paintModal" class="paint-modal">
        <div class="paint-window">
            <div class="paint-titlebar">
                <span class="paint-title">Paint — Секретная вкладка</span>
                <button class="paint-close" id="paintClose">✕</button>
            </div>
            <div class="paint-body">
                <div class="paint-tools">
                    <div class="paint-colors" id="paintColors"></div>
                    <div class="paint-sizes">
                        <button class="paint-size-btn active" data-size="2">●</button>
                        <button class="paint-size-btn" data-size="6">●</button>
                        <button class="paint-size-btn" data-size="14">●</button>
                    </div>
                    <button class="paint-clear-btn" id="paintClear">Очистить</button>
                </div>
                <canvas id="paintCanvas" width="500" height="350"></canvas>
            </div>
            <div class="paint-actions">
                <button class="paint-action-btn" id="heartToggleBtn" title="Сердца">
                    <span class="paint-action-icon" id="heartIcon">♡</span>
                    <span class="paint-action-label">Сердца</span>
                </button>
                <button class="paint-action-btn" id="butterflyToggleBtn" title="Бабочка" disabled>
                    <span class="paint-action-icon">ʚïɞ</span>
                    <span class="paint-action-label">Бабочка</span>
                </button>
            </div>
        </div>
    </div>

    <!-- СИНИЙ ЭКРАН СМЕРТИ -->
    <div id="bsod" class="bsod-screen">
        <div class="bsod-content">
            <div class="bsod-smiley">:(</div>
            <div class="bsod-title">Упс, кажется это вирус!</div>
            <div class="bsod-text">Все мемы потеряны. Перезагрузка...</div>
            <div class="bsod-progress"><div class="bsod-progress-bar" id="bsodProgress"></div></div>
        </div>
    </div>

    <!-- УВЕДОМЛЕНИЕ О PAINT -->
    <div id="paintNotification" class="paint-notification">
        🎨 Открыта секретная вкладка — Paint!
    </div>

    <!-- МОДАЛЬНОЕ ОКНО НАСТРОЕК -->
    <div id="settingsModal" class="settings-modal">
        <div class="settings-window">
            <div class="settings-titlebar">
                <span class="settings-title">⛭ Настройки</span>
                <button class="settings-close" id="settingsClose">✕</button>
            </div>
            <div class="settings-body">
                <div class="settings-group">
                    <label class="settings-label">♫ Громкость музыки</label>
                    <div class="settings-slider-row">
                        <input type="range" id="musicVolume" class="settings-slider" min="0" max="100" value="15">
                        <span class="settings-value" id="musicVolumeValue">15%</span>
                    </div>
                </div>
                <div class="settings-group">
                    <label class="settings-label">☛ Курсор</label>
                    <div class="settings-options">
                        <button class="settings-option active" data-cursor="waves">
                            <span class="settings-option-icon">≈</span>
                            <span>Волны</span>
                        </button>
                        <button class="settings-option" data-cursor="bubbles">
                            <span class="settings-option-icon">🫧</span>
                            <span>Волны + пузырьки</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ПЕРЕКЛЮЧАТЕЛЬ ИГР + ДЕНЬ/НОЧЬ + НАСТРОЙКИ -->
    <div class="mode-switcher">
        <button id="dayNightToggle" class="day-night-btn" title="Переключить день/ночь">☀</button>
        <button id="settingsToggle" class="day-night-btn" title="Настройки">⛭</button>
        <button id="modeBubbles" class="win-btn active">🫧 Пузыри</button>
        <button id="modeWindows" class="win-btn">⚠️ Окна</button>
        <button id="modeBrowser" class="win-btn">🖥️ Браузер</button>
    </div>

    <!-- ЗВУКИ -->
    <audio id="popSoundSmall" src="sounds/pop-small.mp3" preload="auto"></audio>
    <audio id="popSoundFallback" src="sounds/pop.mp3" preload="auto"></audio>
    <audio id="clickSound1" src="sounds/click1.mp3" preload="auto"></audio>
    <audio id="clickSound2" src="sounds/click2.mp3" preload="auto"></audio>
    <audio id="clickSound3" src="sounds/click3.mp3" preload="auto"></audio>
    <audio id="clickFallback" src="sounds/pop.mp3" preload="auto"></audio>
    <audio id="menuSound" src="sounds/menusound.mp3" preload="auto"></audio>
    <audio id="menuFallback" src="sounds/pop.mp3" preload="auto"></audio>
    <audio id="catSound" src="sounds/miau-kotika.mp3" preload="auto"></audio>
    <audio id="catSound2" src="sounds/meow2.mp3" preload="auto"></audio>
    <audio id="memeSound1" src="sounds/meme1.mp3" preload="auto"></audio>
    <audio id="memeSound2" src="sounds/meme2.mp3" preload="auto"></audio>
    <audio id="memeSound3" src="sounds/meme3.mp3" preload="auto"></audio>
    <audio id="memeSound4" src="sounds/meme4.mp3" preload="auto"></audio>
    <audio id="memeSound5" src="sounds/meme5.mp3" preload="auto"></audio>
    <audio id="adOpenSound" src="sounds/ad-open.mp3" preload="auto"></audio>
    <audio id="adCloseSound" src="sounds/ad-close.mp3" preload="auto"></audio>
    <audio id="virusWinSound" src="sounds/virus-win.mp3" preload="auto"></audio>
    <audio id="virusLoseSound" src="sounds/virus-lose.mp3" preload="auto"></audio>
    <audio id="icebreak1" src="sounds/icebreak1.mp3" preload="auto"></audio>
    <audio id="icebreak2" src="sounds/icebreak2.mp3" preload="auto"></audio>
    <audio id="freezeSound" src="sounds/freeze.mp3" preload="auto"></audio>
    <audio id="ambientMusic" src="sounds/Yume_2kki_OST_-_Lotus_Waters_76578992.mp3" loop preload="auto"></audio>
<audio id="track1Sound" src="sounds/nokia_hat_dance.mp3" preload="auto" loop></audio>

    <!-- СКРИПТЫ -->
    <script src="webgl-water.js"></script>
    <script src="script.js"></script>
</body>
</html>
